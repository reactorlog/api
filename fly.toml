# fly deploy --ha=false
# fly secrets set DATABASE_URL=...
#
# Do not point a short-interval HTTP check at /health. That route pings Postgres
# and burns Neon Free CU-hours. Use /live (no DB) instead.

app = "reactorlog"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HTTP_ADDR = ":8080"
  STATIC_DIR = "/app/static"
  CORS_ORIGINS = "https://www.reactorlog.com"
  CORS_ORIGINS = "https://www.reactorlog.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
