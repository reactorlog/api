# fly.toml app configuration file generated for api-1isxfa on 2026-11-28T06:58:13Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'api-1isxfa'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  HTTP_ADDR = ':8080'
  STATIC_DIR = '/app/static'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/live'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
